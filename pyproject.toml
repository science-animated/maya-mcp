[project]
name = "maya-mcp"
version = "1.0.0"
description = "Maya 3D integration through the Model Context Protocol"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "bara-science-animated"}]
dependencies = [
    "mcp[cli]>=2,<3",
]

[project.urls]
Repository = "https://github.com/science-animated/maya-mcp"
Issues = "https://github.com/science-animated/maya-mcp/issues"

[project.scripts]
maya-mcp = "maya_mcp:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=8",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
# Integration tests change the open Maya scene; run them explicitly with `pytest -m integration`
addopts = "-m 'not integration'"
markers = [
    "integration: needs a running Maya with the commandPort open",
]

[tool.ruff]
line-length = 120
target-version = "py310"
# These two files run inside Maya's own Python (3.7 in Maya 2022, 3.9 in 2023):
# never rewrite them with newer syntax
per-file-target-version = { "maya_mcp_handlers.py" = "py37", "userSetup.py" = "py37" }

[tool.ruff.lint]
# pycodestyle, pyflakes (real bugs), import sorting, bugbear (common mistakes)
select = ["E", "W", "F", "I", "B"]
